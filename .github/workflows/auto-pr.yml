name: AUTO-PR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:contracts
      - run: npm run check:build
      - run: node scripts/test-affected.mjs
      - name: Bundle normal validation shell and verify development-code exclusion
        env:
          APP_VARIANT: validation
        run: |
          npx expo export --platform android --output-dir dist/validation --source-maps --max-workers 2
          npm run check:bundle
